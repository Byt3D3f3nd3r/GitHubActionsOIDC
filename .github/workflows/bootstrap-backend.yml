name: Bootstrap Backend
on:
  workflow_dispatch:
    inputs:
      bucket_name:
        description: "Globally unique S3 bucket for Terraform state"
        required: true
      dynamodb_table:
        description: "DynamoDB table for state locking"
        required: true
        default: "tf-lock"
      region:
        description: "AWS region (e.g. eu-west-1)"
        required: true
        default: "eu-west-1"

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ github.event.inputs.region }}

      - name: Create S3 bucket
        run: |
          set -e
          BUCKET="${{ github.event.inputs.bucket_name }}"
          REGION="${{ github.event.inputs.region }}"
          if [ "$REGION" = "us-east-1" ]; then
            aws s3api create-bucket --bucket "$BUCKET" || true
          else
            aws s3api create-bucket --bucket "$BUCKET" \
              --region "$REGION" \
              --create-bucket-configuration LocationConstraint="$REGION" || true
          fi
          aws s3api put-bucket-versioning \
            --bucket "$BUCKET" \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption \
            --bucket "$BUCKET" \
            --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          aws s3api put-public-access-block \
            --bucket "$BUCKET" \
            --public-access-block-configuration \
            'BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true'

      - name: Create DynamoDB lock table
        run: |
          set -e
          aws dynamodb create-table \
            --table-name "${{ github.event.inputs.dynamodb_table }}" \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST || true
