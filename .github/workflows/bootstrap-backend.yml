name: bootstrap-backend
on:
  workflow_dispatch:
    inputs:
      bucket_name:
        description: "Unique S3 bucket for Terraform state"
        required: true
      dynamodb_table:
        description: "Lock table name"
        required: true
        default: "tf-lock"
      region:
        description: "AWS region"
        required: true
        default: "eu-west-1"

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ github.event.inputs.region }}

      - name: Install Terraform
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip
          curl -fsSL https://releases.hashicorp.com/terraform/1.9.5/terraform_1.9.5_linux_amd64.zip -o tf.zip
          unzip tf.zip && sudo mv terraform /usr/local/bin/

      - name: Bootstrap S3 + DynamoDB
        working-directory: modules/bootstrap-backend
        run: |
          terraform init -input=false
          terraform apply -auto-approve \
            -var="bucket_name=${{ github.event.inputs.bucket_name }}" \
            -var="dynamodb_table=${{ github.event.inputs.dynamodb_table }}" \
            -var="region=${{ github.event.inputs.region }}"
